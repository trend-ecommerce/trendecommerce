name: API Guardian Security & Compliance Audit

on:
  push:
    branches: [ main, master, develop, "implement_*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit:
    name: API Guardian Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run API Guardian Audit
        run: |
          python -m api_guardian.cli .
