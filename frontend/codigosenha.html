<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendEcommerce AI</title>
    <link rel="icon" type="image/png" href="assets/logo.png?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="logo">
        <img src="assets/logo.png?v=2" alt="Logo da Empresa">
    </div>
    <div class="login-pai">
        <div class="login-container">
            <form class="login-right" id="formRecoveryStep2" novalidate>
                <h1 class="login-title">DIGITE SEU CÓDIGO:</h1>
                <p class="codigo-subtitle">Digite o código de 6 dígitos enviado para seu e-mail</p>
                <div class="codigo-container">
                    <input class="codigo-input" type="text" id="otp1" maxlength="1" inputmode="numeric" autocomplete="one-time-code">
                    <input class="codigo-input" type="text" id="otp2" maxlength="1" inputmode="numeric" autocomplete="off">
                    <input class="codigo-input" type="text" id="otp3" maxlength="1" inputmode="numeric" autocomplete="off">
                    <input class="codigo-input" type="text" id="otp4" maxlength="1" inputmode="numeric" autocomplete="off">
                    <input class="codigo-input" type="text" id="otp5" maxlength="1" inputmode="numeric" autocomplete="off">
                    <input class="codigo-input" type="text" id="otp6" maxlength="1" inputmode="numeric" autocomplete="off">
                </div>
                <span id="recoveryStep2Error" class="login-field-error center"></span>

                <div class="codigo-resend">
                    <span>Não recebeu o código? </span>
                    <button type="button" id="btnRecoveryResend">Reenviar código</button>
                </div>

                <button type="submit" id="btnRecoveryStep2Submit" class="button-right">ENVIAR</button>
            </form>
            <div class="login-left">
                <h1>RECUPERE<br>SUA SENHA</h1>
                <button type="button" class="login-button" onclick="window.location.href='login.html'">ENTRAR</button>
            </div>
        </div>
    </div>
        
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
