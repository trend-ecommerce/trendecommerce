<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendEcommerce AI</title>
    <link rel="icon" type="image/png" href="assets/logo.png?v=2">
    
    <script>
        if (localStorage.getItem('trendecommerce_token')) {
            window.location.replace('ia-preditiva.html');
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="logo">
        <img src="assets/logo.png?v=2" alt="Logo da Empresa">
    </div>
    <div class="login-pai">
        <div class="login-container">
            <form class="login-right" id="formLogin" novalidate>
                <h1>EMAIL:</h1>
                <input class="login-input" type="email" id="loginEmail" placeholder="Digite seu email..." required autocomplete="email">
                <span id="loginEmailError" class="login-field-error"></span>

                <h1>SENHA:</h1>
                <div class="password-container">
                    <input class="login-input" type="password" id="senha" placeholder="Digite sua senha..." required autocomplete="current-password">
                    <button type="button" id="toggleSenha"><i class="ph ph-eye"></i></button>
                </div>
                <span id="loginPasswordError" class="login-field-error"></span>

                <div id="emailVerificationBanner"></div>

                <button type="submit" id="btnLoginSubmit" class="button-right">ENTRAR</button>

                <div id="coldStartNotice" style="display: none; margin-top: 8px; padding: 6px 12px; background: rgba(0, 174, 239, 0.15); border: 1px solid rgba(0, 174, 239, 0.3); border-radius: 8px; color: #00d4ff; font-size: 11px; text-align: center;">
                    <i class="ph ph-lightning"></i> Conectando ao servidor... Aguarde um momento.
                </div>

                <span class="login-span" onclick="window.location.href='recuperarsenha.html'">Esqueceu sua senha?<br>Clique aqui.</span>
            </form>
            <div class="login-left">
                <h1>BEM-VINDO<br>DE VOLTA!</h1>
                <button type="button" class="login-button" onclick="window.location.href='cadastro.html'">CADASTRAR</button>
            </div>
        </div>
    </div>
        
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
