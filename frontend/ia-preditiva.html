<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendCommerce AI - IA Preditiva</title>
    <link rel="icon" type="image/png" href="assets/logo.png?v=2">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="dashboard-mode">
    <div id="appRoot" class="app-root dashboard-view">
        
        <!-- Efeitos Visuais Cyberpunk de Fundo -->
        <div id="backgroundEffects" class="background-effects">
            <div class="hud-circle hud-circle-left"></div>
            <div class="hud-circle hud-circle-right"></div>
            <div class="hud-circle hud-circle-center"></div>
            <div class="circuit-grid"></div>
            <canvas id="circuit-canvas"></canvas>
        </div>

        <!-- Layout do Dashboard -->
        <div id="dashboardSection" class="dashboard-layout sidebar-open">
            
            <!-- Barra Lateral de Navegação -->
            <aside id="dashSidebar" class="dash-sidebar open" aria-hidden="false">
                <div class="dash-user-profile">
                    <div class="user-avatar-circle">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                    <div class="user-info-text">
                        <span id="dashUserName" class="user-info-name">Administrador</span>
                        <button type="button" id="btnLogout" class="btn-logout-link">
                            Sair
                        </button>
                    </div>
                </div>

                <nav class="dash-nav-menu">
                    <a href="ia-preditiva.html" class="dash-nav-btn active" style="text-decoration: none;">
                        <span>IA PREDITIVA</span>
                    </a>
                    <a href="ranking.html" class="dash-nav-btn" style="text-decoration: none;">
                        <span>RANKING PRODUTOS</span>
                    </a>
                    <a href="analise-especifica.html" class="dash-nav-btn" style="text-decoration: none;">
                        <span>ANÁLISE ESPECÍFICA</span>
                    </a>
                </nav>
            </aside>

            <!-- Área Principal -->
            <div class="dash-main-area">
                
                <header class="dash-top-header">
                    <div class="dash-header-left">
                        <button type="button" id="sidebarToggleBtn" class="sidebar-toggle-btn" title="Alternar menu lateral" aria-label="Alternar menu lateral">
                            <span class="toggle-dot"></span>
                            <span class="toggle-dot"></span>
                            <span class="toggle-dot"></span>
                        </button>
                    </div>
                    <div class="dash-header-right">
                        <div class="dash-brand-logo">
                            <img src="assets/logo.png?v=2" alt="TrendEcommerce Logo" class="dash-brand-img">
                        </div>
                    </div>
                </header>

                <!-- Conteúdo da Aba IA Preditiva -->
                <section class="dash-tab-content active">
                    
                    <!-- Card Gráfico Principal -->
                    <div class="dash-card main-chart-card">
                        <div class="chart-main-area-col" style="display: flex; flex-direction: column; width: 100%; min-width: 0;">
                            
                            <!-- Canvas 2D Nativo do Gráfico de Vendas -->
                            <div class="chart-container-wrap">
                                <canvas id="mainSalesChartCanvas"></canvas>
                                <div id="iaChartTooltip" class="chart-tooltip-bubble" style="display: none;">
                                    <div class="tooltip-title">PRODUTO</div>
                                    <div class="tooltip-price">R$ 0,00</div>
                                    <div class="tooltip-sold">0 VENDIDOS</div>
                                </div>
                            </div>
                        </div>

                        <!-- Controles Laterais (Filtro Datas e Categorias) -->
                        <div class="chart-controls-box">
                            <h3 class="controls-title">MAIS VENDIDOS</h3>
                            <div class="controls-dropdowns">
                                
                                <div id="iaDateFilterWrap" class="dropdown-filter-wrap">
                                    <button type="button" id="btnIaFilterDate" class="btn-dropdown-ctrl">
                                        <span>FILTRAR DATAS</span>
                                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                                            <polyline points="6 9 12 15 18 9"></polyline>
                                        </svg>
                                    </button>
                                    <div id="menuIaFilterDate" class="dates-dropdown-menu" style="display: none;">
                                        <button type="button" class="dropdown-menu-item active" data-days="7">
                                            PRÓXIMOS 7 DIAS
                                        </button>
                                        <button type="button" class="dropdown-menu-item" data-days="14">
                                            PRÓXIMOS 14 DIAS
                                        </button>
                                        <button type="button" class="dropdown-menu-item" data-days="30">
                                            PRÓXIMOS 30 DIAS
                                        </button>
                                    </div>
                                </div>

                                <div id="iaCatFilterWrap" class="dropdown-filter-wrap">
                                    <button type="button" id="btnIaFilterCat" class="btn-dropdown-ctrl" style="gap: 10px; padding: 0 16px;">
                                        <span style="letter-spacing: 0.8px; font-weight: 700;">CATEGORIAS</span>
                                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#00d4ff" stroke-width="2.5" style="flex-shrink: 0;">
                                            <polyline points="6 9 12 15 18 9"></polyline>
                                        </svg>
                                    </button>
                                    <div id="menuIaFilterCat" class="dates-dropdown-menu categories-dropdown-menu" style="display: none; min-width: 290px; right: 0; left: auto; width: max-content; max-width: 330px; top: calc(100% + 6px); z-index: 150;">
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>

                    <!-- Grid Inferior: Mais Vendidos no Mês e Exportar Relatório -->
                    <div class="dash-bottom-grid">
                        <div class="dash-card mais-vendidos-card">
                            <h3 class="dash-card-header-title">MAIS VENDIDOS NO MÊS</h3>
                            <div id="iaMaisVendidosList" class="ranking-rows-container">
                                <p class="empty-msg">Carregando produtos...</p>
                            </div>
                        </div>

                        <div class="dash-card export-card">
                            <h3 class="dash-card-header-title">EXPORTAR<br>RELATÓRIO</h3>
                            <button type="button" id="btnExportExcel" class="btn-export-excel">
                                <span>EXCEL</span>
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="7 10 12 15 17 10"></polyline>
                                    <line x1="12" y1="15" x2="12" y2="3"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                </section>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/ia-preditiva.js"></script>
</body>
</html>
